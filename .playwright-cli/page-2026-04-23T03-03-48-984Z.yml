    - article [ref=e34]:
      - generic [ref=e37]:
        - heading "Claude Code by Anthropic" [level=1] [ref=e39]
        - generic [ref=e40]:
          - paragraph [ref=e41]: Claude Code is an agentic coding system that reads your codebase, makes changes across files, runs tests, and delivers committed code. For builders without an engineering background, it's an entry point to software development that didn't exist until recently.
          - link "Get started" [ref=e44] [cursor=pointer]:
            - /url: https://claude.com/product/claude-code
            - generic [ref=e45]: Get started
      - generic [ref=e48]:
        - generic [ref=e49]:
          - heading "Agentic, not autocomplete" [level=2] [ref=e51]
          - generic [ref=e52]:
            - paragraph [ref=e53]: Describe what you want to build, test, iterate, or ship. Claude Code handles the rest.
            - link "Explore Claude Code" [ref=e55] [cursor=pointer]:
              - /url: https://claude.com/product/claude-code
              - generic [ref=e56]: Explore Claude Code
              - img [ref=e58]
        - figure [ref=e61]:
          - button "Play video" [ref=e63] [cursor=pointer]:
            - img "Video thumbnail" [ref=e64]
            - generic:
              - img
      - generic [ref=e69]:
        - heading "If you can describe it, you can build it" [level=2] [ref=e71]
        - paragraph [ref=e75]:
          - text: The tools engineers use to build software are now capable of building software themselves. That changes what it means to be an engineer. At Anthropic, the majority of code is now written by
          - link "Claude Code" [ref=e76] [cursor=pointer]:
            - /url: https://claude.com/product/claude-code
          - text: ". Engineers focus on architecture, product thinking, and continuous orchestration: managing multiple agents in parallel, giving direction, and making the decisions that shape what gets built."
          - link "Claude Code" [ref=e77] [cursor=pointer]:
            - /url: https://claude.com/product/claude-code
          - text: extends that capability to anyone who can describe what they want to build.
      - generic [ref=e82]:
        - heading "Common use cases for Claude Code" [level=2] [ref=e84]
        - generic [ref=e85]:
          - generic [ref=e86]:
            - generic [ref=e87]: "01"
            - heading "Navigating unfamiliar code" [level=3] [ref=e88]
            - paragraph [ref=e90]: Deep knowledge of systems and architecture that was previously held by a few engineers becomes accessible to the whole team with Claude Code. It searches codebases, traces dependencies, and helps new members get up to speed on projects in minutes.
          - generic [ref=e91]:
            - generic [ref=e92]: "02"
            - heading "Developing across the whole codebase" [level=3] [ref=e93]
            - paragraph [ref=e95]: Claude Code searches directories to build context and understand how modules connect. It creates and edits files across a codebase, taking on ambitious work like building new features or executing multi-file refactors at a scale, saving days of work.
          - generic [ref=e96]:
            - generic [ref=e97]: "03"
            - heading "Executing across your toolchain" [level=3] [ref=e98]
            - paragraph [ref=e100]: Developers don't need to memorize commands for git, Kubernetes, or other CLI tools. They describe what they want and Claude Code uses tools like the GitHub CLI natively, running the right commands with the right syntax.
          - generic [ref=e101]:
            - generic [ref=e102]: "04"
            - heading "Running tests and managing CI failures" [level=3] [ref=e103]
            - paragraph [ref=e105]: When tests fail, Claude Code reads the errors, fixes the code, and runs the suite again until everything passes. It monitors CI pipelines on GitHub and GitLab and commits fixes automatically.
      - generic [ref=e110]:
        - heading "Democratizing who builds software" [level=2] [ref=e112]
        - paragraph [ref=e116]: Claude Code makes development accessible to anyone with an idea. The ability to describe a goal in plain language and get working software back has opened development to people outside engineering. Founders, product managers, designers, and operations teams are building prototypes, internal tools, and personal projects without auditing code line by line.
      - generic [ref=e121]:
        - heading "How Claude Code impacts teams" [level=2] [ref=e123]
        - generic [ref=e124]:
          - paragraph [ref=e127]: From regulated industries to large-scale codebases, engineering organizations are already changing the way their engineering teams work.
          - generic [ref=e128]:
            - heading "Broad engineering adoption" [level=3] [ref=e129]
            - paragraph [ref=e131]:
              - strong [ref=e132]: Stripe
              - text: deployed Claude Code across 1,370 engineers of all levels through a zero-configuration enterprise binary. One team completed a 10,000-line Scala-to-Java migration in four days, work estimated at ten engineer-weeks.
          - generic [ref=e133]:
            - heading "Faster incident response" [level=3] [ref=e134]
            - paragraph [ref=e136]:
              - strong [ref=e137]: Ramp
              - text: integrated Claude Code into their development workflow and cut incident investigation time by 80%. Non-engineering teams across sales, risk, and finance now query their data warehouse using natural language instead of writing SQL.
          - generic [ref=e138]:
            - heading "Shorter project timelines" [level=3] [ref=e139]
            - paragraph [ref=e141]:
              - strong [ref=e142]: Wiz
              - text: migrated a 50,000-line Python library to Go in roughly 20 hours of active development, a project the team estimated at two to three months of manual work.
          - generic [ref=e143]:
            - heading "Faster time to market" [level=3] [ref=e144]
            - paragraph [ref=e146]:
              - strong [ref=e147]: Rakuten
              - text: reduced the average delivery time for new features from 24 working days to 5. Engineers now run multiple Claude Code sessions in parallel, delegating tasks across the codebase simultaneously.
      - generic [ref=e152]:
        - heading "Agent safety" [level=2] [ref=e154]
        - generic [ref=e157]:
          - paragraph [ref=e158]: "Developers control how much autonomy Claude Code has, from approving every action to letting built-in classifiers distinguish safe actions from risky ones automatically. The default is cautious: Claude Code asks before making changes to your files or running commands."
          - paragraph [ref=e159]: Anthropic’s approach to agent safety, including how we design for trust, access boundaries, and human control, is documented in our research.
          - paragraph [ref=e160]:
            - link "Read our research on agent safety" [ref=e161] [cursor=pointer]:
              - /url: https://www.anthropic.com/research
      - generic [ref=e166]:
        - heading "FAQ" [level=1] [ref=e168]
        - generic [ref=e169]:
          - generic [ref=e170]:
            - heading "How is Claude Code different from code completion tools?" [level=3] [ref=e172] [cursor=pointer]
            - generic [ref=e176]:
              - paragraph [ref=e177]: Code completion tools suggest the next line or function as a developer types. Claude Code operates at the project level. It reads the full codebase, plans an approach across multiple files, executes changes, runs tests, and iterates on failures. The developer defines the goal and reviews the result rather than guiding each step.
              - paragraph [ref=e178]
          - generic [ref=e179]:
            - heading "Who should use Claude Code?" [level=3] [ref=e181] [cursor=pointer]
            - paragraph [ref=e186]: Developers who want to hand off full tasks rather than autocomplete lines of code. But we've also seen product managers, founders, and operations teams start building working tools by describing outcomes in plain language.
          - generic [ref=e187]:
            - heading "What does \"agentic\" mean in this context?" [level=3] [ref=e189] [cursor=pointer]
            - generic [ref=e193]:
              - paragraph [ref=e194]: An agentic system acts toward a goal with a degree of autonomy, rather than responding to one prompt at a time. Claude Code reads a codebase, plans a sequence of actions, executes them using real development tools, evaluates the result, and adjusts its approach. The developer sets the objective and retains control over what gets committed, but the execution loop runs independently.
              - paragraph [ref=e195]
          - generic [ref=e196]:
            - heading "How does Anthropic approach safety for an autonomous coding agent?" [level=3] [ref=e198] [cursor=pointer]
            - paragraph [ref=e203]: Claude Code requires explicit permission before modifying files or running commands. It works within the developer's existing environment and uses their tools rather than operating in an opaque backend. Decisions about what code ships remain with the human. Anthropic's broader research on agent safety, including trust calibration, access boundaries, and oversight mechanisms, informs how Claude Code is designed.
      - generic [ref=e206]:
        - generic [ref=e207]:
          - paragraph [ref=e208]: Try Claude Code
          - paragraph [ref=e209]: For installation, pricing, integrations, and technical documentation, visit the Claude Code product page.
        - link "Get started" [ref=e210] [cursor=pointer]:
          - /url: https://claude.com/product/claude-code
          - generic [ref=e211]: Get started
