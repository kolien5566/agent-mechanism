<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" rx="40" fill="#F5F4ED"/>
  <text x="118" y="136" fill="#141413" font-size="56" font-family="Georgia, serif">Prompt → Context → Harness</text>
  <text x="120" y="188" fill="#5E5D59" font-size="26" font-family="Arial, sans-serif">不是流行词替换，而是任务复杂度上升后，工程控制点一步步往外移。</text>

  <rect x="112" y="308" width="398" height="280" rx="28" fill="#FFF7F1" stroke="#EAD1C7" stroke-width="2"/>
  <text x="148" y="368" fill="#141413" font-size="34" font-family="Georgia, serif">Prompt Engineering</text>
  <text x="148" y="428" fill="#4D4C48" font-size="24" font-family="Arial, sans-serif">问题：怎么把任务说清楚</text>
  <text x="148" y="476" fill="#5E5D59" font-size="22" font-family="Arial, sans-serif">典型任务：问答、总结、写作、抽取</text>
  <text x="148" y="520" fill="#5E5D59" font-size="22" font-family="Arial, sans-serif">系统形态：多数还是单轮聊天</text>

  <rect x="602" y="308" width="398" height="280" rx="28" fill="#F3E4DD" stroke="#EAD1C7" stroke-width="2"/>
  <text x="638" y="368" fill="#141413" font-size="34" font-family="Georgia, serif">Context Engineering</text>
  <text x="638" y="428" fill="#4D4C48" font-size="24" font-family="Arial, sans-serif">问题：每一步该给模型看什么</text>
  <text x="638" y="476" fill="#5E5D59" font-size="22" font-family="Arial, sans-serif">典型任务：多轮、多工具、多状态</text>
  <text x="638" y="520" fill="#5E5D59" font-size="22" font-family="Arial, sans-serif">系统形态：开始接检索、文件、历史消息</text>

  <rect x="1092" y="308" width="398" height="280" rx="28" fill="#141413"/>
  <text x="1128" y="368" fill="#FAF9F5" font-size="34" font-family="Georgia, serif">Harness Engineering</text>
  <text x="1128" y="428" fill="#D9D6CF" font-size="24" font-family="Arial, sans-serif">问题：怎么让整套系统把任务做完</text>
  <text x="1128" y="476" fill="#B0AEA5" font-size="22" font-family="Arial, sans-serif">典型任务：长任务、真实执行、结果验证</text>
  <text x="1128" y="520" fill="#B0AEA5" font-size="22" font-family="Arial, sans-serif">系统形态：开始关心执行环境、恢复与协作</text>

  <path d="M510 448H592" stroke="#C96442" stroke-width="10" stroke-linecap="round"/>
  <path d="M574 430L610 448L574 466" fill="none" stroke="#C96442" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1000 448H1082" stroke="#C96442" stroke-width="10" stroke-linecap="round"/>
  <path d="M1064 430L1100 448L1064 466" fill="none" stroke="#C96442" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="454" y="628" width="692" height="102" rx="24" fill="#EFE9DF"/>
  <text x="492" y="690" fill="#C96442" font-size="28" font-family="Arial, sans-serif" font-weight="700">驱动力：</text>
  <text x="624" y="690" fill="#141413" font-size="28" font-family="Arial, sans-serif">任务复杂度上升、多工具、多步骤、真实执行与反馈闭环。</text>
</svg>
