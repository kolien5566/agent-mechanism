<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" rx="40" fill="#F5F4ED"/>
  <text x="118" y="134" fill="#141413" font-size="56" font-family="Georgia, serif">Agent capability stack</text>
  <text x="120" y="186" fill="#5E5D59" font-size="26" font-family="Arial, sans-serif">Agent 不是一堆零散插件，而是一套从运行到底层能力再到任务组织的分层系统。</text>

  <rect x="284" y="660" width="1032" height="120" rx="28" fill="#30302E"/>
  <text x="334" y="726" fill="#FAF9F5" font-size="38" font-family="Georgia, serif">Runtime / Harness</text>
  <text x="710" y="726" fill="#D9D6CF" font-size="24" font-family="Arial, sans-serif">让系统真正跑起来</text>

  <rect x="346" y="538" width="908" height="96" rx="26" fill="#141413"/>
  <text x="392" y="596" fill="#FAF9F5" font-size="36" font-family="Georgia, serif">Tools</text>
  <text x="566" y="596" fill="#D9D6CF" font-size="24" font-family="Arial, sans-serif">终端 / 文件 / 浏览器 / API / 代码执行</text>

  <rect x="420" y="424" width="760" height="88" rx="24" fill="#F3E4DD" stroke="#EAD1C7" stroke-width="2"/>
  <text x="468" y="478" fill="#141413" font-size="34" font-family="Georgia, serif">Retrieval / RAG / MCP</text>
  <text x="854" y="478" fill="#5E5D59" font-size="24" font-family="Arial, sans-serif">让 agent 看见信息，也能把系统接进来</text>

  <rect x="484" y="308" width="632" height="90" rx="24" fill="#FFF7F1" stroke="#EAD1C7" stroke-width="2"/>
  <text x="530" y="363" fill="#141413" font-size="34" font-family="Georgia, serif">Skills / Memory / Subagents</text>
  <text x="928" y="363" fill="#5E5D59" font-size="24" font-family="Arial, sans-serif">复用 / 记忆 / 分工</text>

  <rect x="582" y="194" width="436" height="82" rx="24" fill="#C96442"/>
  <text x="754" y="246" fill="#FAF9F5" font-size="36" font-family="Georgia, serif">Agent</text>

  <g opacity="0.96">
    <rect x="1160" y="272" width="308" height="318" rx="28" fill="#FAF9F5" stroke="#F0EEE6" stroke-width="2"/>
    <text x="1198" y="324" fill="#141413" font-size="30" font-family="Georgia, serif">每一层解决什么问题</text>
    <text x="1198" y="382" fill="#4D4C48" font-size="22" font-family="Arial, sans-serif">Harness：让系统跑起来</text>
    <text x="1198" y="426" fill="#4D4C48" font-size="22" font-family="Arial, sans-serif">Tools：让 agent 真正做事</text>
    <text x="1198" y="470" fill="#4D4C48" font-size="22" font-family="Arial, sans-serif">RAG / MCP：让它能看、能接</text>
    <text x="1198" y="514" fill="#4D4C48" font-size="22" font-family="Arial, sans-serif">Skills：沉淀做法</text>
    <text x="1198" y="558" fill="#4D4C48" font-size="22" font-family="Arial, sans-serif">Memory：延续经验</text>
    <text x="1198" y="602" fill="#4D4C48" font-size="22" font-family="Arial, sans-serif">Subagents：拆任务与隔离上下文</text>
  </g>
</svg>
