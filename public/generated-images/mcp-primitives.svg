<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" rx="40" fill="#F5F4ED"/>
  <text x="120" y="136" fill="#141413" font-size="56" font-family="Georgia, serif">MCP 的 3 个核心原语</text>
  <text x="122" y="188" fill="#5E5D59" font-size="26" font-family="Arial, sans-serif">在 MCP 里，agent 主要通过 Tools、Resources、Prompts 这三类对象接触外部能力。</text>

  <rect x="120" y="280" width="406" height="410" rx="28" fill="#FFF7F1" stroke="#EAD1C7" stroke-width="2"/>
  <text x="166" y="354" fill="#141413" font-size="38" font-family="Georgia, serif">Tools</text>
  <text x="166" y="414" fill="#4D4C48" font-size="28" font-family="Arial, sans-serif">作用：让它做</text>
  <text x="166" y="472" fill="#5E5D59" font-size="24" font-family="Arial, sans-serif">例如：</text>
  <text x="166" y="516" fill="#5E5D59" font-size="24" font-family="Arial, sans-serif">- 创建 issue</text>
  <text x="166" y="552" fill="#5E5D59" font-size="24" font-family="Arial, sans-serif">- 运行查询</text>
  <text x="166" y="588" fill="#5E5D59" font-size="24" font-family="Arial, sans-serif">- 发请求</text>

  <rect x="596" y="240" width="408" height="490" rx="28" fill="#F3E4DD" stroke="#EAD1C7" stroke-width="2"/>
  <text x="638" y="316" fill="#141413" font-size="38" font-family="Georgia, serif">Resources</text>
  <text x="638" y="376" fill="#4D4C48" font-size="28" font-family="Arial, sans-serif">作用：让它看</text>
  <text x="638" y="434" fill="#5E5D59" font-size="24" font-family="Arial, sans-serif">例如：</text>
  <text x="638" y="478" fill="#5E5D59" font-size="24" font-family="Arial, sans-serif">- 文档</text>
  <text x="638" y="514" fill="#5E5D59" font-size="24" font-family="Arial, sans-serif">- 文件</text>
  <text x="638" y="550" fill="#5E5D59" font-size="24" font-family="Arial, sans-serif">- 数据库模式</text>
  <text x="638" y="586" fill="#5E5D59" font-size="24" font-family="Arial, sans-serif">- 系统状态</text>
  <text x="638" y="654" fill="#4D4C48" font-size="24" font-family="Arial, sans-serif">通常是只读信息入口。</text>

  <rect x="1074" y="280" width="406" height="410" rx="28" fill="#141413"/>
  <text x="1120" y="354" fill="#FAF9F5" font-size="38" font-family="Georgia, serif">Prompts</text>
  <text x="1120" y="414" fill="#D9D6CF" font-size="28" font-family="Arial, sans-serif">作用：让它按某种方式想</text>
  <text x="1120" y="474" fill="#B0AEA5" font-size="24" font-family="Arial, sans-serif">例如：</text>
  <text x="1120" y="518" fill="#B0AEA5" font-size="24" font-family="Arial, sans-serif">- 分析模板</text>
  <text x="1120" y="554" fill="#B0AEA5" font-size="24" font-family="Arial, sans-serif">- 固定检查流程</text>
  <text x="1120" y="590" fill="#B0AEA5" font-size="24" font-family="Arial, sans-serif">- 可复用提示骨架</text>

  <rect x="218" y="760" width="1164" height="86" rx="22" fill="#EFE9DF"/>
  <text x="252" y="814" fill="#C96442" font-size="28" font-family="Arial, sans-serif" font-weight="700">课堂讲法：</text>
  <text x="392" y="814" fill="#141413" font-size="28" font-family="Arial, sans-serif">Tools 是“让它做”，Resources 是“让它看”，Prompts 是“让它按一种方式想”。</text>
</svg>
