<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" rx="40" fill="#F5F4ED"/>
  <rect x="84" y="90" width="1432" height="720" rx="32" fill="#FAF9F5" stroke="#F0EEE6" stroke-width="2"/>
  <text x="120" y="160" fill="#141413" font-size="56" font-family="Georgia, serif">LLM 的基本机制：next-token prediction</text>
  <text x="122" y="210" fill="#5E5D59" font-size="26" font-family="Arial, sans-serif">模型读取上下文，然后预测下一个最可能出现的 token，并不断重复这个过程。</text>

  <rect x="120" y="290" width="410" height="310" rx="28" fill="#F3E4DD" stroke="#EAD1C7" stroke-width="2"/>
  <text x="154" y="352" fill="#141413" font-size="34" font-family="Georgia, serif">1. 输入上下文</text>
  <text x="154" y="410" fill="#4D4C48" font-size="28" font-family="Arial, sans-serif">我</text>
  <text x="204" y="410" fill="#4D4C48" font-size="28" font-family="Arial, sans-serif">/</text>
  <text x="230" y="410" fill="#4D4C48" font-size="28" font-family="Arial, sans-serif">今天</text>
  <text x="330" y="410" fill="#4D4C48" font-size="28" font-family="Arial, sans-serif">/</text>
  <text x="356" y="410" fill="#4D4C48" font-size="28" font-family="Arial, sans-serif">想</text>
  <text x="426" y="410" fill="#4D4C48" font-size="28" font-family="Arial, sans-serif">/</text>
  <text x="452" y="410" fill="#4D4C48" font-size="28" font-family="Arial, sans-serif">讲</text>
  <text x="154" y="470" fill="#4D4C48" font-size="28" font-family="Arial, sans-serif">AI</text>
  <text x="216" y="470" fill="#4D4C48" font-size="28" font-family="Arial, sans-serif">/</text>
  <text x="244" y="470" fill="#4D4C48" font-size="28" font-family="Arial, sans-serif">Agent</text>
  <text x="154" y="545" fill="#5E5D59" font-size="22" font-family="Arial, sans-serif">模型先看到前文，当前的信息就是它能用来继续生成的依据。</text>

  <path d="M558 444H742" stroke="#C96442" stroke-width="10" stroke-linecap="round"/>
  <path d="M726 426L758 444L726 462" fill="none" stroke="#C96442" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="770" y="290" width="300" height="310" rx="28" fill="#FFF7F1" stroke="#EAD1C7" stroke-width="2"/>
  <text x="806" y="352" fill="#141413" font-size="34" font-family="Georgia, serif">2. 预测下一个 token</text>
  <rect x="830" y="402" width="178" height="78" rx="20" fill="#141413"/>
  <text x="879" y="452" fill="#FAF9F5" font-size="34" font-family="Arial, sans-serif">是什么</text>
  <text x="834" y="532" fill="#87867F" font-size="24" font-family="Arial, sans-serif">备选 token：可以 / 的 / 是 / 如何</text>

  <path d="M1100 444H1284" stroke="#C96442" stroke-width="10" stroke-linecap="round"/>
  <path d="M1268 426L1300 444L1268 462" fill="none" stroke="#C96442" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="1310" y="290" width="206" height="310" rx="28" fill="#F3EDE3" stroke="#E8E6DC" stroke-width="2"/>
  <text x="1346" y="352" fill="#141413" font-size="34" font-family="Georgia, serif">3. 不断重复</text>
  <circle cx="1414" cy="452" r="62" fill="#FAF9F5" stroke="#C96442" stroke-width="10"/>
  <path d="M1414 388C1450 388 1478 416 1478 452" stroke="#C96442" stroke-width="8" stroke-linecap="round"/>
  <path d="M1446 390L1482 390L1482 426" stroke="#C96442" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1352" y="560" fill="#5E5D59" font-size="22" font-family="Arial, sans-serif">于是得到一整段话、代码或解释。</text>

  <rect x="120" y="664" width="1396" height="94" rx="24" fill="#EFE9DF"/>
  <text x="154" y="722" fill="#C96442" font-size="28" font-family="Arial, sans-serif" font-weight="700">结论：</text>
  <text x="246" y="722" fill="#141413" font-size="28" font-family="Arial, sans-serif">LLM 擅长生成与判断，但不天然擅长执行与控制。</text>
</svg>
