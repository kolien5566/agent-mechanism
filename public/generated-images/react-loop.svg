<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" rx="40" fill="#F5F4ED"/>
  <text x="118" y="140" fill="#141413" font-size="56" font-family="Georgia, serif">ReAct：从回答模式到执行系统</text>
  <text x="120" y="192" fill="#5E5D59" font-size="26" font-family="Arial, sans-serif">Reason → Act → Observe 不是一句口号，而是 agent 的真实任务闭环。</text>

  <rect x="120" y="360" width="250" height="140" rx="24" fill="#FFF7F1" stroke="#EAD1C7" stroke-width="2"/>
  <text x="160" y="420" fill="#141413" font-size="34" font-family="Georgia, serif">用户目标</text>
  <text x="160" y="468" fill="#4D4C48" font-size="24" font-family="Arial, sans-serif">“修掉这个报错并解释原因”</text>

  <path d="M398 430H510" stroke="#C96442" stroke-width="10" stroke-linecap="round"/>
  <path d="M492 412L528 430L492 448" fill="none" stroke="#C96442" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="880" cy="470" r="232" fill="#FAF9F5" stroke="#E8E6DC" stroke-width="4"/>
  <circle cx="880" cy="470" r="158" fill="#F3E4DD" fill-opacity="0.48"/>

  <rect x="777" y="244" width="206" height="92" rx="24" fill="#141413"/>
  <text x="832" y="300" fill="#FAF9F5" font-size="34" font-family="Arial, sans-serif">Reason</text>

  <rect x="1090" y="430" width="190" height="92" rx="24" fill="#C96442"/>
  <text x="1150" y="487" fill="#FAF9F5" font-size="34" font-family="Arial, sans-serif">Act</text>

  <rect x="776" y="618" width="208" height="92" rx="24" fill="#30302E"/>
  <text x="814" y="674" fill="#FAF9F5" font-size="34" font-family="Arial, sans-serif">Observe</text>

  <path d="M983 336C1068 352 1132 390 1178 450" stroke="#C96442" stroke-width="8" stroke-linecap="round"/>
  <path d="M1172 434L1190 472L1148 468" stroke="#C96442" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M1090 530C1062 602 1012 648 944 682" stroke="#C96442" stroke-width="8" stroke-linecap="round"/>
  <path d="M958 654L924 692L978 690" stroke="#C96442" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M774 620C700 592 648 544 614 478" stroke="#C96442" stroke-width="8" stroke-linecap="round"/>
  <path d="M646 484L604 462L620 508" stroke="#C96442" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M768 290C700 310 644 350 604 404" stroke="#C96442" stroke-width="8" stroke-linecap="round"/>
  <path d="M604 392L590 438L634 412" stroke="#C96442" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <g>
    <rect x="1160" y="238" width="258" height="150" rx="22" fill="#FAF9F5" stroke="#F0EEE6" stroke-width="2"/>
    <text x="1194" y="286" fill="#141413" font-size="28" font-family="Georgia, serif">Act 会调用什么</text>
    <text x="1194" y="332" fill="#4D4C48" font-size="22" font-family="Arial, sans-serif">终端 · 文件 · 浏览器 · API</text>
  </g>

  <g>
    <rect x="1194" y="580" width="230" height="136" rx="22" fill="#FAF9F5" stroke="#F0EEE6" stroke-width="2"/>
    <text x="1228" y="628" fill="#141413" font-size="28" font-family="Georgia, serif">Observe 在看什么</text>
    <text x="1228" y="674" fill="#4D4C48" font-size="22" font-family="Arial, sans-serif">测试结果</text>
    <text x="1228" y="704" fill="#4D4C48" font-size="22" font-family="Arial, sans-serif">报错日志</text>
  </g>

  <rect x="1320" y="400" width="190" height="140" rx="24" fill="#FFF7F1" stroke="#EAD1C7" stroke-width="2"/>
  <text x="1358" y="460" fill="#141413" font-size="34" font-family="Georgia, serif">完成任务</text>
  <text x="1360" y="505" fill="#4D4C48" font-size="22" font-family="Arial, sans-serif">修好 + 解释原因</text>

  <rect x="118" y="746" width="1390" height="90" rx="24" fill="#EFE9DF"/>
  <text x="156" y="802" fill="#C96442" font-size="28" font-family="Arial, sans-serif" font-weight="700">关键理解：</text>
  <text x="302" y="802" fill="#141413" font-size="28" font-family="Arial, sans-serif">当 Act 能真的操作环境时，agent 就不只是“想”，而是在真实地“做”。</text>
</svg>
